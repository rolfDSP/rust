[package]
name = "r_proj_070"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# "bundled" compiles SQLite itself (with FTS5 and JSON) into the program,
# so no system library is needed. "functions" enables user-defined SQL
# functions, "backup" the online backup API.
rusqlite = { version = "0.42", features = ["bundled", "functions", "backup"] }
serde_json = "1"
